_target_: experiments.tagging.wrappers.CGENNLGATrGraphTransWrapper
out_channels: null              # init_physics -> num_outputs 

net:
  _target_: experiments.baselines.CGENNLGATrGraphTransHybrid.CGENNLGATrGraphTrans
  _partial_: true
  in_s_channels: null          #should be 
  # num_classes is supplied by the wrapper at call time (= out_channels)

  hidden_mv_channels: 16
  hidden_s_channels: 32
  num_blocks: 10
  num_heads: 8
  head_scale: true
  checkpoint_blocks: false

  k: 16
  cgenn_layers: 3
  cgenn_hidden_h: 72
  cgenn_hidden_x: 8             # match official CGENN (tag_cgenn hidden_features_x=8); mv-bridge lifts 8->16
  cgenn_aggregation: mean
  cgenn_residual: false           # match official CGENN top-tagging (LorentzCGGNN default) and the tag_cgenn reference row
  cgenn_layer_type: fc
  cgenn_normalization_init: null  # match official CGENN top-tagging (LorentzCGGNN default: no NormalizationLayer) and the tag_cgenn reference row
  concat_original: true
  use_explicit_edge_features: true

  beam_spurion: xyplane
  add_time_spurion: true
  beam_mirror: true
  knn_metric: minkowski

defaults:
  - framesnet: identity

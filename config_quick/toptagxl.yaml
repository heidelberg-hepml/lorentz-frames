exp_type: toptagxl
exp_name: toptagxl_debug

data:
 data_dir: data/toptagxl
 features: default
 data_config: null
 train_files_range: [0,1]     # layout: train is 000-499
 test_files_range: [500,501]  # test is 500-624
 val_files_range: [625,626]   # val is 625-674

topxl_params:
 num_workers: 2
 fetch_step: 1
 extra_selection: null
 extra-test-selection: null
 fetch_by_files: true
 in_memory: False
 not_remake_weights: False
 steps_per_epoch: null
 steps_per_epoch_val: null
 events_per_file: 100000
 async_load: true
 split_num: 1

evaluation:
 batchsize: 1024
 eval_set: [test]

plotting:
 roc: true
 score: true

defaults:
 - tagging
 - _self_

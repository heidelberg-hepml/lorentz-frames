exp_type: jctagging
exp_name: jc_debug

data:
 data_dir: data/JetClass/Pythia
 features: default
 data_config: null
 # JetClass numbers its files continuously across the three split folders:
 # train_100M has 000-099, test_20M has 100-119, val_5M has 120-124. Use one
 # existing file from EACH folder (the previous [122,123]/[123,124] pointed at
 # train/test file numbers that live only in val_5M -> zero files).
 train_files_range: [0, 1]
 test_files_range: [100, 101]
 val_files_range: [120, 121]

jc_params:
 num_workers: 2
 fetch_step: 0.01
 extra_selection: null
 extra-test-selection: null
 fetch_by_files: False
 in_memory: False
 not_remake_weights: False
 steps_per_epoch: null
 steps_per_epoch_val: null
 events_per_file: 100000
 async_load: true
 split_num: 1

plotting:
 roc: false
 score: false

defaults:
 - tagging
 - _self_
